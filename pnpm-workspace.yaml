packages:
  - "apps/*"
  - "packages/*"

# Only these packages may run install scripts (needed by wrangler / vite).
allowBuilds:
  esbuild: true
  workerd: true

# Safe versions of tools used only while developing (not part of the deployed app).
minimumReleaseAgeExclude:
  - daisyui@5.7.42

# Patched versions of packages that only the build and test tools use (pnpm audit --audit-level high in CI).
overrides:
  sharp: ">=0.35.5"
  undici: ">=7.29.1 <8"
  source-map-js: ">=1.2.2"
