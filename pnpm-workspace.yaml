packages:
  - "apps/*"
  - "packages/*"

# Only these packages may run install scripts (needed by wrangler / vite).
allowBuilds:
  esbuild: true
  workerd: true

# Safe versions of tools used only while developing (not part of the deployed app).
minimumReleaseAgeExclude:
  - daisyui@5.7.42

# Patched versions forced everywhere they appear, mostly inside build and test tools (pnpm audit --audit-level high in CI).
overrides:
  sharp: ">=0.35.5"
  undici: ">=7.30.1 <8"
  source-map-js: ">=1.2.2"
  zod: ">=4.6.6 <5"
